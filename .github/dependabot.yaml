version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    labels:
      - "changelog/ignore"
    groups:
      github-actions:
        patterns:
          - "*"
  # The e2e module replaces the root module with ../../, so a root bump must
  # update test/e2e in the same PR or its go mod tidy check fails.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/test/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    labels:
      - "changelog/dependencies"
    groups:
      k8s:
        patterns:
          - "k8s.io/*"
      go-modules:
        group-by: dependency-name
        patterns:
          - "*"
